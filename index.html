<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f72"><title>מדברים עברית עם בלאל שיבלי</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;font-family:Arial,sans-serif;background:#f2f7f7;color:#163c3a}header{background:linear-gradient(135deg,#087f72,#12a997);color:white;padding:28px 18px;border-radius:0 0 28px 28px;text-align:center}h1{font-size:27px;margin:8px}main{max-width:700px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 15px #0001}button{background:#087f72;color:white;border:0;border-radius:12px;padding:12px 18px;font-size:17px;cursor:pointer;margin:4px}button.secondary{background:#e0f2ef;color:#075e54}.ar{color:#6b7475;font-size:19px;margin:8px 0}.phrase{font-size:24px;font-weight:bold}.small{font-size:14px;color:#677}.nav{display:flex;gap:8px;flex-wrap:wrap}#logo{width:125px;height:125px;object-fit:contain;border-radius:16px;background:white;display:none;margin:auto}#score{font-weight:bold}input{padding:12px;border:1px solid #aaa;border-radius:10px;width:90%;font-size:18px}.dialogue-line{border-bottom:1px solid #dce9e5;padding:12px 0}.dialogue-line .phrase{font-size:21px}.dialogue-line button{font-size:14px;padding:8px 12px} .hidden{display:none}</style></head><body><header><img id="logo" src="logo.png" alt="לוגו אישי" onload="this.style.display='block'" onerror="this.style.display='none'"><h1>מדברים עברית עם בלאל שיבלי</h1><div lang="ar">نتحدث العبرية مع بلال شبلي</div><p>לוֹמְדִים • שׁוֹמְעִים • מְדַבְּרִים</p></header><main><div class="card"><h2>בחרו נושא | اختاروا موضوعًا</h2><div class="nav" id="topics"></div></div><div class="card" id="lesson"><h2 id="topicTitle"></h2><div class="small" id="counter"></div><p class="phrase" id="he"></p><p class="ar" dir="rtl" lang="ar" id="ar"></p><button onclick="speak()">🔊 השמעה</button><button class="secondary" onclick="next()">המשפט הבא ←</button><button class="secondary" onclick="previous()">→ הקודם</button></div><div class="card" id="dialogueBox"><h2>שיחות לדוגמה | محادثات نموذجية</h2><div class="nav" id="dialogueTopics"></div><div id="dialogueLines"></div><button onclick="speakDialogue()">🔊 השמעת השיחה</button></div><div class="card"><h2>תרגול | تدريب</h2><p id="question"></p><div id="answers"></div><p id="feedback" aria-live="polite"></p><p id="score"></p><button class="secondary" onclick="newQuestion()">שאלה חדשה</button></div><p class="small">האפליקציה פועלת גם ללא חיבור לרשת לאחר התקנה. השמעה תלויה בקולות העברית הזמינים במכשיר.</p></main><script>
const data=[
{title:'היכרות וברכות',ar:'التعارف والتحيات',phrases:[['שָׁלוֹם!','مرحبا!'],['מַה שְּׁלוֹמְךָ?','كيف حالك؟ (للمذكر)'],['מַה שְּׁלוֹמֵךְ?','كيف حالك؟ (للمؤنث)'],['אֲנִי בְּסֵדֶר, תּוֹדָה.','أنا بخير، شكرًا.'],['אֵיךְ קוֹרְאִים לְךָ?','ما اسمك؟ (للمذكر)'],['קוֹרְאִים לִי בִּלַאל.','اسمي بلال.'],['נָעִים מְאוֹד.','تشرفت بمعرفتك.'],['בֹּקֶר טוֹב!','صباح الخير!'],['לְהִתְרָאוֹת!','إلى اللقاء!']]},
{title:'בבית הספר',ar:'في المدرسة',phrases:[['אֵיפֹה הַכִּתָּה שֶׁלִּי?','أين صفي؟'],['אֶפְשָׁר לִשְׁאוֹל שְׁאֵלָה?','هل يمكنني أن أسأل سؤالا؟'],['אֲנִי לֹא מֵבִין.','أنا لا أفهم. (للمذكر)'],['אֲנִי לֹא מְבִינָה.','أنا لا أفهم. (للمؤنث)'],['אֶפְשָׁר לַחֲזֹר, בְּבַקָּשָׁה?','هل يمكن الإعادة، من فضلك؟'],['פִּתְחוּ אֶת הַסֵּפֶר.','افتحوا الكتاب.'],['אֲנִי צָרִיךְ עִפָּרוֹן.','أحتاج إلى قلم رصاص. (للمذكر)']]},
{title:'אוכל ושתייה',ar:'الطعام والشراب',phrases:[['אֲנִי רָעֵב.','أنا جائع. (للمذكر)'],['אֲנִי רְעֵבָה.','أنا جائعة. (للمؤنث)'],['אֲנִי צָמֵא.','أنا عطشان. (للمذكر)'],['אֲנִי רוֹצֶה מַיִם, בְּבַקָּשָׁה.','أريد ماء، من فضلك. (للمذكر)'],['מָה אַתָּה אוֹהֵב לֶאֱכוֹל?','ماذا تحب أن تأكل؟ (للمذكر)'],['אֲנִי אוֹהֵב פִּיצָה.','أنا أحب البيتزا. (للمذكر)'],['בְּתֵאָבוֹן!','صحة وعافية!']]},
{title:'שיחות יומיומיות',ar:'محادثات يومية',phrases:[['מָה הַשָּׁעָה?','كم الساعة؟'],['אֵיפֹה אַתָּה גָּר?','أين تسكن؟ (للمذكر)'],['אֲנִי הוֹלֵךְ הַבַּיְתָה.','أنا ذاهب إلى البيت. (للمذكر)'],['כַּמָּה זֶה עוֹלֶה?','كم سعر هذا؟'],['תּוֹדָה רַבָּה!','شكرا جزيلا!'],['בְּבַקָּשָׁה.','تفضل / على الرحب والسعة.']]}];const dialogues=[
{title:'היכרות',ar:'التعارف',lines:[['א','שָׁלוֹם! מַה שִּׁמְךָ?','مرحبا! ما اسمك؟ (للمذكر)'],['ב','שָׁלוֹם! קוֹרְאִים לִי יוֹסֵף.','مرحبا! اسمي يوسف.'],['א','נָעִים מְאוֹד, יוֹסֵף.','تشرفت بمعرفتك يا يوسف.'],['ב','נָעִים מְאוֹד גַּם לִי.','تشرفت بمعرفتك أيضًا.']]},
{title:'בכיתה',ar:'في الصف',lines:[['א','סְלִיחָה, אֶפְשָׁר לִשְׁאוֹל שְׁאֵלָה?','عذرًا، هل يمكنني أن أسأل سؤالًا؟'],['ב','כֵּן, בְּבַקָּשָׁה.','نعم، تفضل.'],['א','אֵיפֹה הַסֵּפֶר שֶׁלִּי?','أين كتابي؟'],['ב','הַסֵּפֶר שֶׁלְּךָ עַל הַשֻּׁלְחָן.','كتابك على الطاولة. (للمذكر)']]},
{title:'בהפסקה',ar:'في الاستراحة',lines:[['א','אַתָּה רוֹצֶה לְשַׂחֵק?','هل تريد أن تلعب؟ (للمذكر)'],['ב','כֵּן, בְּשִׂמְחָה!','نعم، بكل سرور!'],['א','בּוֹא נְשַׂחֵק בַּחָצֵר.','هيا نلعب في الساحة.'],['ב','רַעְיוֹן מְצֻיָּן!','فكرة ممتازة!']]},
{title:'בחנות',ar:'في الدكان',lines:[['א','שָׁלוֹם, כַּמָּה זֶה עוֹלֶה?','مرحبًا، كم سعر هذا؟'],['ב','זֶה עוֹלֶה עֲשָׂרָה שְׁקָלִים.','سعره عشرة شواقل.'],['א','אֶפְשָׁר בְּבַקָּשָׁה אֶחָד?','هل يمكنني الحصول على واحد، من فضلك؟'],['ב','בְּוַדַּאי. בְּבַקָּשָׁה!','بالتأكيد، تفضل!']]}];let dt=0;function showDialogue(){document.getElementById('dialogueTopics').innerHTML=dialogues.map((d,k)=>'<button class="'+(k===dt?'':'secondary')+'" onclick="dt='+k+';showDialogue()">'+d.title+' | '+d.ar+'</button>').join('');document.getElementById('dialogueLines').innerHTML=dialogues[dt].lines.map((l,j)=>'<div class="dialogue-line"><b>דובר '+l[0]+'</b><div class="phrase">'+l[1]+'</div><div class="ar" lang="ar">'+l[2]+'</div><button class="secondary" onclick="speakText(dialogues[dt].lines['+j+'][1])">🔊 השמעה</button></div>').join('')}function speakText(txt){if(!('speechSynthesis' in window)){alert('השמעה אינה נתמכת בדפדפן זה');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='he-IL';u.rate=.8;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('he'));if(v)u.voice=v;speechSynthesis.speak(u)}function speakDialogue(){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();let lines=dialogues[dt].lines;lines.forEach(l=>{let u=new SpeechSynthesisUtterance(l[1]);u.lang='he-IL';u.rate=.8;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('he'));if(v)u.voice=v;speechSynthesis.speak(u)})}let t=0,i=0,correct=0,total=0,q=null;const $=id=>document.getElementById(id);function render(){ $('topics').innerHTML=data.map((x,k)=>`<button class="${k===t?'':'secondary'}" onclick="choose(${k})">${x.title}<br><small>${x.ar}</small></button>`).join('');let d=data[t];$('topicTitle').textContent=d.title+' | '+d.ar;$('counter').textContent=(i+1)+' / '+d.phrases.length;$('he').textContent=d.phrases[i][0];$('ar').textContent=d.phrases[i][1]}function choose(k){t=k;i=0;render();newQuestion()}function next(){i=(i+1)%data[t].phrases.length;render()}function previous(){i=(i+data[t].phrases.length-1)%data[t].phrases.length;render()}function speak(){speakText(data[t].phrases[i][0])}function newQuestion(){let a=data[t].phrases;q=Math.floor(Math.random()*a.length);let opts=[q];while(opts.length<Math.min(3,a.length)){let x=Math.floor(Math.random()*a.length);if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);$('question').textContent='מה פירוש המשפט: '+a[q][0]+' ?';$('answers').innerHTML=opts.map(k=>`<button class="secondary" onclick="answer(${k})">${a[k][1]}</button>`).join('');$('feedback').textContent='';$('score').textContent=`נכון: ${correct} מתוך ${total}`}function answer(k){total++;if(k===q){correct++;$('feedback').textContent='כל הכבוד! إجابة صحيحة ✅'}else $('feedback').textContent='נסה שוב! حاول مرة أخرى ❌';$('score').textContent=`נכון: ${correct} מתוך ${total}`;$('answers').querySelectorAll('button').forEach(b=>b.disabled=true)}render();showDialogue();newQuestion();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
<</script><script src="ai.js"></script></body></html>
